[project]
name = "ksef-watch"
version = "0.2.0"
description = "Powiadomienia na Telegram/e-mail o nowych fakturach kosztowych w KSeF i przypomnienia o terminach płatności"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ksef2>=0.22,<1",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
    "keyring; sys_platform == 'win32'",
]

[project.optional-dependencies]
pdf = ["ksef2[pdf]"]
dev = ["pytest>=8"]

[project.scripts]
ksef-watch = "ksef_watch.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ksef_watch"]
