name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ksef-watch .
      - name: PDF renders inside the image
        run: |
          docker run --rm -v "$PWD/tests/fixtures:/fx:ro" --entrypoint python ksef-watch -c \
            "from ksef_watch.watcher import render; n, d = render(open('/fx/fa3_sample.xml','rb').read(), 'pdf', 'x'); assert n.endswith('.pdf') and d[:5] == b'%PDF-', n"
